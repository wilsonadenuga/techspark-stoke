name: Supplemental Install

on:
  schedule:
    # Off-peak hours to fill gaps
    - cron: '5 2,6,23 * * *'
    - cron: '48 0,4,17 * * 1-4'
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Randomize and install
        run: |
          # 50-65% chance of running
          roll=$((RANDOM % 100))
          threshold=$(( (RANDOM % 16) + 50 ))

          if [ "$roll" -lt "$threshold" ]; then
            # 1-3 installs
            count=$(( (RANDOM % 3) + 1 ))
            echo "Running $count install(s)"

            for i in $(seq 1 $count)
            do
              dir=$(mktemp -d)
              cd "$dir"
              npm init -y > /dev/null
              npm install react-smart-conditional
              cd /
              rm -rf "$dir"

              # Short pause between installs (3-10 seconds)
              pause=$(( (RANDOM % 8) + 3 ))
              sleep $pause
            done
          else
            echo "Skipping this run (rolled $roll, needed < $threshold)"
          fi
